<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Site Survey RF</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#5b6470; --card:#fff; --line:#d9dee5; --acc:#1f6feb; --bad:#d33; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1216; --fg:#e6e9ee; --muted:#9aa4b1; --card:#171b21; --line:#2a313a; --acc:#4c8dff; --bad:#ff6b6b; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); padding-bottom:84px; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:16px; margin:0 auto 0 0; }
  main { display:grid; grid-template-columns: 340px 1fr; gap:12px; padding:12px 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .col { display:grid; gap:12px; align-content:start; min-width:0; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 8px; }
  label { display:block; margin:8px 0 2px; color:var(--muted); font-size:12px; }
  input, select, button { font:inherit; padding:9px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); width:100%; min-height:42px; }
  button { background:var(--acc); color:#fff; border:none; cursor:pointer; margin-top:8px; }
  button.sec { background:transparent; color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .status { font-size:12px; color:var(--muted); }
  .bad { color:var(--bad); }
  canvas { width:100%; display:block; background:var(--bg); border-radius:6px; touch-action:manipulation; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { border-bottom:1px solid var(--line); padding:5px 4px; text-align:left; }
  .tablewrap { overflow-x:auto; }
  #log { font:11px monospace; max-height:180px; overflow:auto; white-space:pre-wrap; color:var(--muted); }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); display:flex; gap:10px; align-items:center; z-index:3; }
  #bar button { margin:0; font-weight:600; }
  #bar .status { flex:1; }
  #btnCapture { flex:0 0 46%; min-height:52px; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
</style>
</head>
<body>
<header>
  <h1>Site Survey RF</h1>
  <span id="conn" class="status">desconectado</span>
</header>
<main>
  <div class="col">
    <section>
      <h2>Dispositivo</h2>
      <select id="device"></select>
      <details style="margin-top:8px"><summary>Opções de conexão</summary>
        <label>Tipo de conexão USB</label>
        <select id="transport">
          <option value="auto">Automático (WebUSB no Android, Web Serial no PC)</option>
          <option value="webusb">Forçar WebUSB</option>
        </select>
      </details>
      <div class="row">
        <button id="btnConnect">Conectar</button>
        <button id="btnDisconnect" class="sec" disabled>Desconectar</button>
      </div>
    </section>
    <section>
      <h2>Varredura</h2>
      <label>Faixa pronta</label>
      <select id="preset"></select>
      <div class="row">
        <div><label>Início (MHz)</label><input id="fStart" type="number" inputmode="decimal" step="any"></div>
        <div><label>Fim (MHz)</label><input id="fStop" type="number" inputmode="decimal" step="any"></div>
      </div>
      <div class="row">
        <div><label>Pontos</label><input id="pts" type="number" inputmode="numeric"></div>
        <div><label>Leituras (média)</label><input id="avg" type="number" inputmode="numeric" min="1"></div>
      </div>
      <div id="hint" class="status" style="margin-top:8px"></div>
    </section>
    <section>
      <h2>Ponto de coleta</h2>
      <label>Nome / referência</label><input id="label" placeholder="ex.: Sala 12, corredor B">
      <div class="row">
        <div><label>Posição na planta</label><input id="xy" readonly placeholder="toque na planta"></div>
        <div><label>GPS</label><input id="gps" readonly placeholder="—"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center"><input id="autoGps" type="checkbox" style="width:auto;min-height:0"> Pegar GPS automaticamente em cada coleta</label>
    </section>
  </div>
  <div class="col">
    <section>
      <h2>Espectro (última leitura)</h2>
      <canvas id="spec" width="900" height="280"></canvas>
    </section>
    <section>
      <h2>Planta / mapa de calor</h2>
      <div class="row">
        <div><label>Métrica do mapa</label>
          <select id="metric">
            <option value="max">Pico na faixa (dBm)</option>
            <option value="mean">Média na faixa (dBm)</option>
            <option value="chpow">Potência integrada (dBm)</option>
          </select></div>
        <div><label>Imagem da planta</label><input id="planFile" type="file" accept="image/*"></div>
      </div>
      <canvas id="plan" width="900" height="560" style="margin-top:8px"></canvas>
    </section>
    <section>
      <h2>Pontos coletados (<span id="count">0</span>)</h2>
      <div class="tablewrap"><table><thead><tr><th>#</th><th>Nome</th><th>Hora</th><th>Pico dBm</th><th>Freq. pico MHz</th><th>Métrica</th><th></th></tr></thead><tbody id="tbl"></tbody></table></div>
      <div class="row">
        <button id="btnCsv" class="sec">Exportar CSV</button>
        <button id="btnJson" class="sec">Exportar JSON</button>
      </div>
      <div class="row">
        <div><label>Abrir sessão (JSON)</label><input id="fileLoad" type="file" accept=".json,application/json"></div>
        <button id="btnClear" class="sec" style="align-self:end">Nova sessão</button>
      </div>
    </section>
    <section>
      <h2>Log</h2>
      <div id="log"></div>
      <button id="btnCopyLog" class="sec">Copiar log</button>
    </section>
  </div>
</main>
<div id="bar">
  <span id="capStatus" class="status">Conecte um dispositivo para começar.</span>
  <button id="btnCapture" disabled>Coletar ponto</button>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
